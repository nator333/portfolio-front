<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hiro Nakamata — Software Engineer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />

    <!--
      PWA: installable as a home-screen app (iOS "Add to Home Screen" gives a
      full-screen, one-tap editor). iOS Safari ignores most manifest fields, so
      the apple-* tags below are what make the standalone launch and icon work
      there; the manifest covers Android/desktop.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Portfolio" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="assets/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="assets/icons/icon-167.png" />

    <!--
      Default social-share preview (Open Graph + Twitter Card).
      Crawlers (X, Slack, iMessage) don't run JS, so these must live in the
      static HTML. They cover the domain and every top-level route, which all
      serve this index.html. Per-post blog previews are a separate, dynamic
      concern (see the SPA fallback note in README) and are not handled here.
    -->
    <meta name="description" content="Hiro Nakamata's portfolio — software engineering, projects, and blog." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hiro's Portfolio" />
    <meta property="og:title" content="Hiro's Portfolio" />
    <meta property="og:description" content="Hiro Nakamata's portfolio — software engineering, projects, and blog." />
    <meta property="og:url" content="https://nakamata.tech/" />
    <meta property="og:image" content="https://nakamata.tech/assets/og/name-art.png" />
    <meta property="og:image:secure_url" content="https://nakamata.tech/assets/og/name-art.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hiro Nakamata — name in gold calligraphy" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hiro's Portfolio" />
    <meta name="twitter:description" content="Hiro Nakamata's portfolio — software engineering, projects, and blog." />
    <meta name="twitter:image" content="https://nakamata.tech/assets/og/name-art.png" />
    <meta name="twitter:image:alt" content="Hiro Nakamata — name in gold calligraphy" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
